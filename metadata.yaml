name: astrbot_plugin_orbit_command
display_name: Orbit Cache
short_desc: 缓存用完就扔的自动清洁工，附带空间地图与重复 Bot 检测。
desc: |
  把会越攒越多的东西定期扫掉：停用插件的内存、NapCat 的图片与文件缓存、
  NapCat 协议缓存、AstrBot 临时文件与日志，以及你指定目录里的过期媒体文件。
  另外还有一个只读的空间地图，告诉你空间到底被谁吃了。

  装上就干活。停用插件时顺手清内存，到点自动清缓存，缓存目录自己搜自己认。
  你只需要点一次「试运行」，看看它到底会删什么。
version: "1.4.0"
author: 娜莉灵
repo: https://github.com/naliling/astrbot_plugin_orbit_command
astrbot_version: ">=4.27.5,<5"
support_platforms:
  - aiocqhttp
license: AGPL-3.0-only
tags:
  - 缓存清理
  - 自动维护
  - NapCat
  - AstrBot
  - 插件管理
  - 运维
